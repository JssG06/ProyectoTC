services:
  # Base de Datos
  db-seguros:
    image: postgres:15-alpine
    container_name: db-seguros
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=agencia_seguros
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - red_trasera

  # Servidor Web
  web-seguros:
    build: .
    container_name: web-seguros
    ports:
      - "8086:80"
    volumes:
      - ./app:/var/www/html
    networks:
      - red_frontal
      - red_trasera
    depends_on:
      - db-seguros

networks:
  red_frontal:
    driver: bridge
  red_trasera:
    driver: bridge